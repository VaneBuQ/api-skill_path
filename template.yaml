AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  SkillPath — 5 microservicios independientes sobre AWS Lambda + DynamoDB,
  patrón database-per-service. Cloud Computing, CDIA V5 — UTEC Posgrado.

# ---------------------------------------------------------------------------
# Parámetros
# ---------------------------------------------------------------------------
Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Entorno de despliegue. Prefija el nombre de todas las tablas.

  JwtSecretParameter:
    Type: String
    Default: /skillpath/dev/jwt-secret
    Description: >
      Nombre del parámetro de SSM (SecureString) con el secreto de firma del JWT.
      Nunca se escribe el secreto en esta plantilla.

  CorsOrigin:
    Type: String
    Default: "*"
    Description: >
      Origen permitido para CORS. En prod debe ser el dominio de CloudFront;
      en dev, http://localhost:5173.

# ---------------------------------------------------------------------------
# Valores comunes a todas las funciones
# ---------------------------------------------------------------------------
Globals:
  Function:
    Runtime: python3.11
    Architectures: [arm64]      # ~20% más barato que x86_64 a igual rendimiento
    MemorySize: 256             # el valor usado en el costeo del informe
    Timeout: 10
    Tracing: Active
    Environment:
      Variables:
        STAGE: !Ref Stage
        LOG_LEVEL: INFO
        CORS_ORIGIN: !Ref CorsOrigin
        JWT_SECRET: !Sub "{{resolve:ssm-secure:${JwtSecretParameter}}}"
    Layers:
      - !Ref CommonLayer
    Tags:
      Project: SkillPath
      Course: CloudComputing

Resources:

  # =========================================================================
  # Código compartido por los cinco microservicios.
  # Un layer en vez de copiar el paquete en cada función: así la definición de
  # "concepto dominado" o del algoritmo SM-2 existe una sola vez y no hay forma
  # de que dos servicios calculen porcentajes distintos.
  # =========================================================================
  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "skillpath-${Stage}-common"
      Description: Utilidades compartidas de SkillPath (errores, JWT, reglas de negocio)
      ContentUri: shared/
      CompatibleRuntimes: [python3.11]
      CompatibleArchitectures: [arm64]
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.11
      BuildArchitecture: arm64

  # =========================================================================
  # CAPA 3 — API  ·  HTTP API (observación #13: no REST API, que cuesta 3.5×)
  # =========================================================================
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins: [!Ref CorsOrigin]
        AllowHeaders: [Authorization, Content-Type]
        AllowMethods: [GET, POST, DELETE, OPTIONS]
        MaxAge: 600
      Auth:
        Authorizers:
          JwtAuthorizer:
            FunctionArn: !GetAtt AuthorizerFunction.Arn
            FunctionInvokeRole: !GetAtt AuthorizerInvokeRole.Arn
            Identity:
              Headers: [Authorization]
              ReauthorizeEvery: 300
            AuthorizerPayloadFormatVersion: "2.0"
            EnableSimpleResponses: true
        # Por defecto TODO exige token. Las rutas públicas lo desactivan
        # explícitamente, que es el sentido seguro: olvidar una anotación
        # deja la ruta protegida, no abierta.
        DefaultAuthorizer: JwtAuthorizer
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogs.Arn
        Format: '{"requestId":"$context.requestId","route":"$context.routeKey","status":"$context.status","latency":"$context.responseLatency","integrationError":"$context.integrationErrorMessage"}'

  ApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apigateway/skillpath-${Stage}"
      RetentionInDays: 14

  # ---- Authorizer ---------------------------------------------------------
  # Valida el JWT una sola vez, en el borde, y entrega el userId ya resuelto a
  # todos los servicios (observación #3: el userId nunca viaja en la URL).
  AuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "skillpath-${Stage}-authorizer"
      CodeUri: services/authorizer/
      Handler: app.lambda_handler
      MemorySize: 128
      Timeout: 5

  AuthorizerInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: apigateway.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeAuthorizer
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt AuthorizerFunction.Arn

  # =========================================================================
  # auth-service  ·  tabla propia: Users
  # =========================================================================
  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "skillpath-${Stage}-auth-service"
      CodeUri: services/auth_service/
      Handler: app.lambda_handler
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref UsersTable}
      Events:
        Register:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: POST
            Path: /auth/register
            Auth:
              Authorizer: NONE
        Login:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: POST
            Path: /auth/login
            Auth:
              Authorizer: NONE
        Me:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /auth/me

  # =========================================================================
  # topics-service  ·  tablas propias: Topics, UserTopics
  # =========================================================================
  TopicsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "skillpath-${Stage}-topics-service"
      CodeUri: services/topics_service/
      Handler: app.lambda_handler
      Environment:
        Variables:
          TOPICS_TABLE: !Ref TopicsTable
          USER_TOPICS_TABLE: !Ref UserTopicsTable
      Policies:
        - DynamoDBReadPolicy: {TableName: !Ref TopicsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref UserTopicsTable}
      Events:
        ListTopics:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /topics
            Auth:
              Authorizer: NONE
        FollowTopic:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: POST
            Path: /topics/{topicId}/follow
        UnfollowTopic:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: DELETE
            Path: /topics/{topicId}/follow
        MyTopics:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /me/topics

  # =========================================================================
  # flashcards-service  ·  tablas propias: Flashcards, UserCardReviews
  # =========================================================================
  FlashcardsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "skillpath-${Stage}-flashcards-service"
      CodeUri: services/flashcards_service/
      Handler: app.lambda_handler
      Environment:
        Variables:
          FLASHCARDS_TABLE: !Ref FlashcardsTable
          USER_CARD_REVIEWS_TABLE: !Ref UserCardReviewsTable
          USER_TOPICS_TABLE: !Ref UserTopicsTable
          PROGRESS_FUNCTION: !Sub "skillpath-${Stage}-progress-service"
      Policies:
        - DynamoDBReadPolicy: {TableName: !Ref FlashcardsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref UserCardReviewsTable}
        - DynamoDBReadPolicy: {TableName: !Ref UserTopicsTable}
        # Observación #6: no escribe en la tabla de progreso — invoca al servicio.
        - LambdaInvokePolicy: {FunctionName: !Sub "skillpath-${Stage}-progress-service"}
      Events:
        DueCards:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /flashcards/{topicId}
        ReviewCard:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: POST
            Path: /flashcards/{cardId}/review

  # =========================================================================
  # progress-service  ·  tabla propia: UserProgress
  # =========================================================================
  ProgressFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "skillpath-${Stage}-progress-service"
      CodeUri: services/progress_service/
      Handler: app.lambda_handler
      Environment:
        Variables:
          USER_PROGRESS_TABLE: !Ref UserProgressTable
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref UserProgressTable}
      Events:
        AllProgress:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /progress
        TopicProgress:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /progress/{topicId}

  # =========================================================================
  # quiz-service  ·  tabla propia: QuizAttempts
  # =========================================================================
  QuizFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "skillpath-${Stage}-quiz-service"
      CodeUri: services/quiz_service/
      Handler: app.lambda_handler
      Timeout: 15                 # genera 10 preguntas con sus distractores
      Environment:
        Variables:
          QUIZ_ATTEMPTS_TABLE: !Ref QuizAttemptsTable
          FLASHCARDS_FUNCTION: !Sub "skillpath-${Stage}-flashcards-service"
          PROGRESS_FUNCTION: !Sub "skillpath-${Stage}-progress-service"
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref QuizAttemptsTable}
        # Observación #7: no lee la tabla Flashcards — llama al servicio dueño.
        - LambdaInvokePolicy: {FunctionName: !Sub "skillpath-${Stage}-flashcards-service"}
        - LambdaInvokePolicy: {FunctionName: !Sub "skillpath-${Stage}-progress-service"}
      Events:
        StartQuiz:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: POST
            Path: /quiz/{topicId}/start
        SubmitQuiz:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: POST
            Path: /quiz/{quizId}/submit
        GetQuiz:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /quiz/{quizId}

  # =========================================================================
  # CAPA 4 — DATOS
  # Una o más tablas por servicio; ningún servicio tiene permiso sobre las
  # tablas de otro (ver las políticas IAM de cada función, arriba).
  # =========================================================================

  # ---- auth-service -------------------------------------------------------
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "skillpath-${Stage}-users"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      AttributeDefinitions:
        - {AttributeName: userId, AttributeType: S}
      KeySchema:
        - {AttributeName: userId, KeyType: HASH}
      # Sin GSI por correo: la búsqueda va por un ítem centinela
      # "EMAIL#<correo>" en esta misma tabla, que además impone la unicidad.
      # Un GSI sería de consistencia eventual, así que quien acaba de
      # registrarse podría no poder iniciar sesión durante unos milisegundos.

  # ---- topics-service -----------------------------------------------------
  TopicsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "skillpath-${Stage}-topics"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      AttributeDefinitions:
        - {AttributeName: topicId, AttributeType: S}
        - {AttributeName: isActive, AttributeType: S}
        - {AttributeName: name, AttributeType: S}
      KeySchema:
        - {AttributeName: topicId, KeyType: HASH}
      GlobalSecondaryIndexes:
        # Evita un Scan del catálogo y lo devuelve ya ordenado por nombre,
        # que es como lo pinta el prototipo.
        - IndexName: active-name-index
          KeySchema:
            - {AttributeName: isActive, KeyType: HASH}
            - {AttributeName: name, KeyType: RANGE}
          Projection: {ProjectionType: ALL}

  UserTopicsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "skillpath-${Stage}-user-topics"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      AttributeDefinitions:
        - {AttributeName: userId, AttributeType: S}
        - {AttributeName: topicId, AttributeType: S}
      KeySchema:
        - {AttributeName: userId, KeyType: HASH}
        - {AttributeName: topicId, KeyType: RANGE}

  # ---- flashcards-service -------------------------------------------------
  FlashcardsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "skillpath-${Stage}-flashcards"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      AttributeDefinitions:
        - {AttributeName: topicId, AttributeType: S}
        - {AttributeName: cardId, AttributeType: S}
      KeySchema:
        - {AttributeName: topicId, KeyType: HASH}
        - {AttributeName: cardId, KeyType: RANGE}

  UserCardReviewsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "skillpath-${Stage}-user-card-reviews"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      AttributeDefinitions:
        - {AttributeName: userId, AttributeType: S}
        # Observación #4: la SK es "topicId#cardId", no solo cardId. Con la
        # clave del informe original no se podían consultar las tarjetas
        # pendientes de UN tema sin leer las de todos.
        - {AttributeName: topicCardId, AttributeType: S}
        - {AttributeName: userTopicKey, AttributeType: S}
        - {AttributeName: nextReviewDate, AttributeType: S}
      KeySchema:
        - {AttributeName: userId, KeyType: HASH}
        - {AttributeName: topicCardId, KeyType: RANGE}
      GlobalSecondaryIndexes:
        # La consulta principal de la app: "tarjetas de este usuario en este
        # tema que vencen hoy o antes". Devuelve exactamente esas, sin filtrar
        # en memoria.
        - IndexName: due-index
          KeySchema:
            - {AttributeName: userTopicKey, KeyType: HASH}
            - {AttributeName: nextReviewDate, KeyType: RANGE}
          Projection: {ProjectionType: ALL}

  # ---- progress-service ---------------------------------------------------
  UserProgressTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "skillpath-${Stage}-user-progress"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      AttributeDefinitions:
        - {AttributeName: userId, AttributeType: S}
        # La SK es el topicId, salvo un ítem especial "#STATS" por usuario que
        # guarda racha y XP (observación #1). Como "#" ordena antes que
        # cualquier letra, una sola Query trae estadísticas + todos los temas.
        - {AttributeName: topicId, AttributeType: S}
      KeySchema:
        - {AttributeName: userId, KeyType: HASH}
        - {AttributeName: topicId, KeyType: RANGE}

  # ---- quiz-service -------------------------------------------------------
  QuizAttemptsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "skillpath-${Stage}-quiz-attempts"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      AttributeDefinitions:
        - {AttributeName: userId, AttributeType: S}
        # quizId es un ULID: ordenable por tiempo, así que Query(userId)
        # devuelve el historial en orden cronológico sin índice adicional.
        - {AttributeName: quizId, AttributeType: S}
        - {AttributeName: userTopicKey, AttributeType: S}
        - {AttributeName: startedAt, AttributeType: S}
      KeySchema:
        - {AttributeName: userId, KeyType: HASH}
        - {AttributeName: quizId, KeyType: RANGE}
      GlobalSecondaryIndexes:
        - IndexName: topic-attempt-index
          KeySchema:
            - {AttributeName: userTopicKey, KeyType: HASH}
            - {AttributeName: startedAt, KeyType: RANGE}
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes: [score, status, topicId]

# ---------------------------------------------------------------------------
Outputs:
  ApiBaseUrl:
    Description: URL base de la API. Va en VITE_API_BASE_URL del frontend.
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
    Export: {Name: !Sub "skillpath-${Stage}-api-url"}

  UsersTableName:
    Value: !Ref UsersTable
  TopicsTableName:
    Value: !Ref TopicsTable
  UserTopicsTableName:
    Value: !Ref UserTopicsTable
  FlashcardsTableName:
    Value: !Ref FlashcardsTable
  UserCardReviewsTableName:
    Value: !Ref UserCardReviewsTable
  UserProgressTableName:
    Value: !Ref UserProgressTable
  QuizAttemptsTableName:
    Value: !Ref QuizAttemptsTable
